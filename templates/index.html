<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindEase AI Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Added Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            height: 100vh;
            margin: 0;
        }

        .chat-window {
            height: calc(100vh - 220px);
            scrollbar-width: thin;
            scrollbar-color: #86efac #f0fdf4;
        }

        .chat-window::-webkit-scrollbar {
            width: 6px;
        }

        .chat-window::-webkit-scrollbar-track {
            background: #f0fdf4;
        }

        .chat-window::-webkit-scrollbar-thumb {
            background-color: #86efac;
            border-radius: 10px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            margin: 0 1px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Markdown Styling Fixes */
        .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.5rem; }
        .markdown-content p { margin-bottom: 0.5rem; }
        .markdown-content h3 { font-weight: 600; font-size: 1.1rem; margin-top: 0.5rem; margin-bottom: 0.25rem; }
        .markdown-content strong { font-weight: 700; color: #065f46; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Component to safely render Markdown strings as HTML
        const MarkdownMessage = ({ content, isHuman }) => {
            const getHtml = () => {
                // Parse markdown and sanitize/set html
                const rawHtml = marked.parse(content, { breaks: true });
                return { __html: rawHtml };
            };

            return (
                <div 
                    className={`text-sm md:text-base leading-relaxed markdown-content ${isHuman ? 'text-white' : 'text-gray-800'}`}
                    dangerouslySetInnerHTML={getHtml()} 
                />
            );
        };

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [backendStatus, setBackendStatus] = useState("checking");
            const chatEndRef = useRef(null);

            const scrollToBottom = () => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, loading]);

            useEffect(() => {
                const checkBackend = async () => {
                    try {
                        const res = await fetch("http://localhost:8000/chat", { 
                            method: "OPTIONS" 
                        });
                        setBackendStatus("online");
                    } catch (e) {
                        setBackendStatus("offline");
                    }
                };
                checkBackend();
            }, []);

            const handleSend = async () => {
                if (!input.trim() || loading) return;

                const userMsg = { role: "human", content: input };
                setMessages(prev => [...prev, userMsg]);
                setInput("");
                setLoading(true);

                try {
                    const response = await fetch("http://localhost:8000/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: input,
                            history: messages
                        })
                    });

                    if (response.status === 404) {
                        throw new Error("404: The '/chat' route was not found.");
                    }

                    const data = await response.json();

                    if (data.answer) {
                        setMessages(prev => [...prev, { role: "assistant", content: data.answer }]);
                        setBackendStatus("online");
                    } else if (data.error) {
                        setMessages(prev => [...prev, { role: "assistant", content: "I encountered an error: " + data.error }]);
                    }
                } catch (error) {
                    setBackendStatus("offline");
                    setMessages(prev => [...prev, { 
                        role: "assistant", 
                        content: `**Connection Error:** ${error.message}. Please ensure your Flask backend is running on port 8000.` 
                    }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-3xl mx-auto h-screen flex flex-col p-4 md:p-6">
                    {/* Header */}
                    <header className="flex items-center justify-between mb-6 glass-card p-4 rounded-2xl shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center text-white shadow-lg">
                                <i className="fas fa-leaf text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-green-900">MindEase AI</h1>
                                <div className="flex items-center gap-2">
                                    <span className={`w-2 h-2 rounded-full ${backendStatus === 'online' ? 'bg-green-400' : 'bg-red-400'}`}></span>
                                    <span className="text-xs text-green-700 font-medium">
                                        {backendStatus === 'online' ? 'Empathetic Companion Online' : 'Backend Offline (Port 8000)'}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <button 
                            onClick={() => setMessages([])}
                            className="text-gray-400 hover:text-green-600 transition-colors p-2"
                            title="Reset Conversation"
                        >
                            <i className="fas fa-redo-alt"></i>
                        </button>
                    </header>

                    {/* Chat Area */}
                    <div className="flex-1 glass-card rounded-3xl shadow-lg overflow-hidden flex flex-col border border-white">
                        <div className="chat-window flex-1 overflow-y-auto p-6">
                            {messages.length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center text-center space-y-4 opacity-60">
                                    <i className="fas fa-heart text-5xl text-green-300"></i>
                                    <div className="max-w-xs">
                                        <p className="text-green-900 font-medium">Hello there. I'm MindEase.</p>
                                        <p className="text-sm text-green-800">I'm here to listen to your thoughts or talk about your day. How are you feeling right now?</p>
                                    </div>
                                </div>
                            )}

                            {messages.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'human' ? 'justify-end' : 'justify-start'} mb-6`}>
                                    <div className={`flex flex-col max-w-[85%] ${msg.role === 'human' ? 'items-end' : 'items-start'}`}>
                                        <div className={`px-4 py-3 rounded-2xl shadow-sm ${
                                            msg.role === 'human' 
                                            ? 'bg-green-600 text-white rounded-tr-none' 
                                            : 'bg-white text-gray-800 border border-green-50 rounded-tl-none'
                                        }`}>
                                            <MarkdownMessage content={msg.content} isHuman={msg.role === 'human'} />
                                        </div>
                                        <span className="text-[10px] text-gray-400 mt-1 px-1 capitalize">
                                            {msg.role === 'human' ? 'You' : 'Companion'}
                                        </span>
                                    </div>
                                </div>
                            ))}

                            {loading && (
                                <div className="flex justify-start mb-6">
                                    <div className="bg-white border border-green-50 px-4 py-3 rounded-2xl rounded-tl-none shadow-sm">
                                        <div className="typing-dot"></div>
                                        <div className="typing-dot"></div>
                                        <div className="typing-dot"></div>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className="p-4 bg-white/50 border-t border-green-100">
                            <div className="relative flex items-center">
                                <input 
                                    type="text" 
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                    placeholder="Type your message..."
                                    className="w-full pl-6 pr-16 py-4 rounded-full border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent shadow-inner bg-white/80"
                                />
                                <button 
                                    onClick={handleSend}
                                    disabled={!input.trim() || loading}
                                    className={`absolute right-2 w-11 h-11 rounded-full flex items-center justify-center transition-all ${
                                        input.trim() && !loading 
                                        ? 'bg-green-600 text-white shadow-md' 
                                        : 'bg-gray-200 text-gray-400'
                                    }`}
                                >
                                    <i className={`fas ${loading ? 'fa-spinner fa-spin' : 'fa-paper-plane'}`}></i>
                                </button>
                            </div>
                            <p className="text-[10px] text-center text-green-700/50 mt-3">
                                MindEase AI is a supportive companion, not a medical professional. If you are in crisis, please call 988.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
